services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile.server.prod
    image: beacon-server
    pull_policy: never
    labels:
      - "com.docker.compose.project=beacon-web"
    container_name: beacon-server
    restart: on-failure:max=2
    ports:
      - 3021:5000
    depends_on:
      - db
      - osrm
    links:
      - db
      - osrm
    environment:
      - OSRM_BASE_URL=http://osrm:5000

  # osrm:
  #   image: osrm/osrm-backend
  #   container_name: beacon-osrm
  #   command: osrm-routed --algorithm mld /data/utah-latest.osrm --max-table-size 1000
  #   restart: on-failure:max=2
  #   labels:
  #     - "com.docker.compose.project=beacon-web"
  #   volumes:
  #     - /app_data/beacon/osrm-data:/data

  db:
    image: beacon-db:latest
    pull_policy: never
    container_name: beacon-db
    restart: on-failure:max=2
    build:
      context: .
      dockerfile: ./Dockerfile.db
    labels:
      - "com.docker.compose.project=beacon-web"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beacon
    ports:
      - 3022:5432
    volumes:
      - db-data:/var/lib/postgresql/data

  backup:
    image: beacon-backup:latest
    pull_policy: never
    container_name: beacon-backup
    restart: on-failure:max=2
    build:
      context: .
      dockerfile: ./Dockerfile.backup
    labels:
      - "com.docker.compose.project=beacon-web"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beacon
    volumes:
      - /home/arthur/backups:/backup-dir
    depends_on:
      - db
    links:
      - db

volumes:
  db-data:
    name: beacon-data