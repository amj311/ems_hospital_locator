services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile.server.prod
    image: beacon-server
    pull_policy: never
    labels:
      - "com.docker.compose.project=beacon"
    container_name: beacon-server
    restart: on-failure:max=2
    ports:
      - 3041:5000
    volumes:
      - ${ANDROID_DOWNLOADS_DIR:?Set by deploy.sh}:/app/downloads:ro
    depends_on:
      - db
    links:
      - db

  db:
    image: beacon-db:latest
    pull_policy: never
    container_name: beacon-db
    restart: on-failure:max=2
    build:
      context: .
      dockerfile: ./Dockerfile.db
    labels:
      - "com.docker.compose.project=beacon"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beacon
    ports:
      - 3042:5432
    volumes:
      - db-data:/var/lib/postgresql/data

  backup:
    image: beacon-backup:latest
    pull_policy: never
    container_name: beacon-backup
    restart: on-failure:max=2
    build:
      context: .
      dockerfile: ./Dockerfile.backup
    labels:
      - "com.docker.compose.project=beacon"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beacon
    volumes:
      - /home/arthur/backups:/backup-dir
    depends_on:
      - db
    links:
      - db

volumes:
  db-data:
    name: beacon-data