services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile.server.dev
    labels:
      - "com.docker.compose.project=beacon-web"
    container_name: beacon-server-dev
    command: ["yarn", "server:dev"]
    restart: on-failure:max=2
    ports:
      - 5001:5000
    depends_on:
      - db
      # - osrm
    volumes:
      # Mount the source code for live reload
      - ./:/app
      - /app/node_modules
      # Exclude certain directories from the volume to prevent container issues
      - /app/chrome-data
      - /app/dist
      # Docker socket for running osrm-setup.sh from inside the container
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/beacon
    
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend.dev
    container_name: beacon-frontend-dev
    restart: unless-stopped
    ports:
      - 5174:5173
    volumes:
      # Mount the source code for live reload
      - ./:/app
      - /app/node_modules
      - /app/chrome-data
    environment:
      - NODE_ENV=development
    
  db:
    image: beacon-db:latest
    pull_policy: never
    container_name: beacon-db-dev
    build:
      context: .
      dockerfile: ./Dockerfile.db
    labels:
      - "com.docker.compose.project=beacon-web"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=beacon
    ports:
      - 3003:5432
    volumes:
      - db-data:/var/lib/postgresql/data

  # osrm:
  #   image: osrm/osrm-backend
  #   container_name: beacon-osrm-dev
  #   command: osrm-routed --algorithm mld /data/utah-latest.osrm --max-table-size 1000
  #   restart: unless-stopped
  #   ports:
  #     - "5001:5000"
  #   volumes:
  #     - ${OSRM_DATA_PATH:-./osrm-data}:/data
  #   labels:
  #     - "com.docker.compose.project=beacon-web"

volumes:
  db-data:
    name: beacon-data